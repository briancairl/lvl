<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lvl - level editor</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1c; }
    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
    #status { position: absolute; left: 12px; bottom: 8px; color: #999; font: 12px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="status">Loading...</div>
  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      arguments: (new URLSearchParams(window.location.search)).getAll('arg'),
      preRun: [function () { try { FS.mkdir('/work'); } catch (e) {} FS.chdir('/work'); }],
      print: function (text) { console.log(text); },
      printErr: function (text) { console.error(text); },
      setStatus: function (text) { document.getElementById('status').textContent = text; },
      onRuntimeInitialized: function () { document.getElementById('status').textContent = ''; },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
